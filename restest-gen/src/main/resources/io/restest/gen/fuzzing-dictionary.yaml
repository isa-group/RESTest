# Values to push at an API with, rather than values meant to work.
#
# Nothing here is claimed to be invalid. A great many APIs accept an empty word, a zero or an
# empty list quite happily, and whether any of these is acceptable depends on the parameter it
# fills - which a list indexed by the kind of value cannot know. What they have in common is
# that they are the values careless code falls over on, and an API falling over is a fault
# whatever was sent.
#
# Written for RESTest 2.0. Extend it with a file of your own rather than editing this one.

version: 1
name: fuzzing
description: >-
  Values to push at an API with. Not claimed to be invalid: many APIs accept an empty word or a
  zero, and what these have in common is that they are what careless code falls over on.
keyedBy: type

values:
  any:
    - null
  string:
    - ""
    - " "
    - "\t"
    - "\n"
    - "\u0000"
    - "\u001b[31m"
    - ""
    - "0"
    - "-1"
    - "null"
    - "true"
    - "undefined"
    - "NaN"
    - "🙂🙂🙂"
    - "مرحبا"
    - "'"
    - "\""
    - "<>"
    - "%00"
    - "../.."
    - "   surrounded by spaces   "
    # A number written as a word, and numbers past what any machine number holds.
    - "1.5"
    - "-0"
    - "1e400"
    # Letters that grow when their case changes, marks piled on letters, and characters that
    # are there without being seen: a line or paragraph separator, a byte-order mark, a space of
    # no width, the mark that turns text round, a family of people joined into one emoji.
    - "ßﬃİȺ"
    - "Z̴̡̛͉a̵̢͠l̸̨g̷̛o̶̡"
    - "\u2028"
    - "\u0085"
    - "\ufeff"
    - "\u200b"
    - "\u202eabc"
    - "👨‍👩‍👧"
    # What a template or a format string reads as an instruction, and the two classic ways in
    # through text a program glues into another language.
    - "{{7*7}}"
    - "${7*7}"
    - "%s%s%s%n"
    - "' OR '1'='1"
    - "<script>alert(1)</script>"
    # Sentences: many words, spaces and punctuation, which an error message that repeats what it
    # was given repeats too.
    - "the quick brown fox jumps over the lazy dog while five boxing wizards jump quickly"
    - "a sentence of many words, separated by spaces, commas; and other punctuation: does it survive?"
    - "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore"
    # Ten thousand characters.
    - ""
  integer:
    - -1
    - 0
    - 2147483647
    - 2147483648
    - -2147483648
    - -2147483649
    - 9223372036854775807
    - -9223372036854775808
    - 99999999999999999999999999999999
    # A number with a fraction, a number far past any machine number, and a whole number written
    # as a word, or no number at all.
    - 1.5
    - 1e400
    - "1"
    - "abc"
  number:
    - -1
    - 0
    - 0.0000000001
    - 2147483648
    - 1e308
    - -1e308
    - 99999999999999999999999999999999.999999
    # The smallest a double holds, and one too large for it; a number written as a word, a word
    # that is no number, and a yes-or-no.
    - 1e-308
    - 1e400
    - "1.5"
    - "abc"
    - true
  boolean:
    - "true"
    - "yes"
    - 0
    - 1
    - 2147483648
    # Numbers with a fraction, and the other yes-or-no written as a word and as a digit.
    - 0.5
    - 1.5
    - "false"
    - "1"
  array:
    - []
    - [null]
    - ["", "", ""]
    # Lists of empty lists and of an empty object, and one holding a value of every kind.
    - [[]]
    - [[], []]
    - [{}]
    - [1, "a", true, null, {}, []]
  object:
    - {}
    - {"": null}
    # Objects inside objects, a property a program's own machinery is named by, and one whose only
    # value is null.
    - {"a": {"b": {"c": {}}}}
    - {"__proto__": {"polluted": true}}
    - {"a": null}
