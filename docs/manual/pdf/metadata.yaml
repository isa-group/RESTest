# What the PDF of the manual says about itself, and how it looks. Read by docs/manual/pdf.sh; the
# subtitle, the date and the commit links point at are given there.
title: The RESTest manual
author: ISA Research Group, Universidad de Sevilla
lang: en-GB
titlepage: true
toc-own-page: true
book: true
classoption: [oneside]
colorlinks: true
linkcolor: blue
urlcolor: blue
# Long lines of output wrap instead of running off the page. The template already does this for code
# with a language named; output blocks have none, and are wrapped the same way here.
header-includes: |
  \RecustomVerbatimEnvironment{verbatim}{Verbatim}{breaklines, breakanywhere, fontsize=\small}
