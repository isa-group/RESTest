.kind-x{grid-column:2 / 4;display:flex;flex-direction:column;gap:6px}
.kind-ops{display:flex;flex-wrap:wrap;gap:6px}
.opchip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:4px 10px;font-family:var(--mono);font-size:var(--fs-xs);cursor:pointer;min-height:34px}
.opchip:hover{border-color:var(--tx3)}
.opchip .n{font-family:var(--sans);color:var(--tx2);font-variant-numeric:tabular-nums}

.lrow{border-bottom:1px solid var(--line2);padding:15px 18px}
.lrow:last-child{border-bottom:0}
.lrow-h{display:grid;grid-template-columns:28px 250px minmax(120px,340px) minmax(0,1fr) auto;gap:4px 16px;align-items:center}
.lrow .lt{font-weight:650;font-size:var(--fs-m)}
.lrow .lv{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lv.zero{color:var(--tx3)}
.lv.warn{color:var(--warn)}
.lv.err{color:var(--err)}
.lv.ok{color:var(--ok)}
.lrow .ld{font-size:var(--fs-s);color:var(--tx2)}
.lrow .ico{color:var(--tx3);display:flex}
.llist{margin:10px 0 0 44px;padding:8px 12px 8px 30px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--code-bg);font-family:var(--mono);font-size:var(--fs-xs);display:flex;flex-direction:column;gap:4px}
@media (max-width: 900px){.lrow-h{grid-template-columns:28px minmax(0,1fr) auto}.lrow .lv,.lrow .ld,.lrow-h .disclose{grid-column:2 / 4}.llist{margin-left:0}}

footer{font-size:var(--fs-s);color:var(--tx2);display:flex;flex-wrap:wrap;gap:6px 18px;border-top:1px solid var(--line);padding-top:16px}

@media (prefers-reduced-motion: no-preference){
  .rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
  .d1{animation-delay:40ms}.d2{animation-delay:110ms}.d3{animation-delay:180ms}.d4{animation-delay:250ms}.d5{animation-delay:320ms}.d6{animation-delay:390ms}
  .bar-r .fill{animation:fill .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:300ms;transform-origin:left}
  .tl-col{animation:grow .6s cubic-bezier(.2,.7,.2,1) both;transform-origin:bottom}
  .detail,.kind-x,.llist{animation:fade .25s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fill{from{transform:scaleX(0)}to{transform:none}}
  @keyframes grow{from{transform:scaleY(0)}to{transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
}
</style>

          return h('span', { cls: swatch(c), style: 'flex:' + o.byClass[c] + ' 1 0' });
        }))),
      h('td', { cls: 'cnt ' + (o.errors ? 'err' : 'zero'), text: o.errors ? n(o.errors) : '—' }),
      h('td', { cls: 'cnt ' + (o.warnings ? 'warn' : 'zero'), text: o.warnings ? n(o.warnings) : '—' }),
      h('td', null, ICON.chevron(14)));
    tr.addEventListener('click', function () {
      state.open[id] = !state.open[id];
      drawRows();
      var again = document.getElementById('op-' + id);
      if (again) again.querySelector('.op-btn').focus();
    });
    if (!open) return tr;
    return [tr, h('tr', { cls: 'detail-row' }, h('td', { colspan: 8 }, detailOf(o)))];
  }
  function classesLine(byClass) {
    return present(byClass).map(function (c) { return classWord(c) + ' ' + n(byClass[c]); }).join(' · ');
  }
  var details = table();
  /** An operation's detail, built the first time it is shown with this kind chosen and kept after. */
  function detailOf(o) {
    var id = o.op.operation, key = id + '\u0000' + (state.kind[id] || (o.faults[0] && o.faults[0].code) || '');
    return details[key] || (details[key] = detail(o));
  }
  function detail(o) {
    var id = o.op.operation;
    var box = h('div', { cls: 'detail' });
    box.addEventListener('click', function (event) { event.stopPropagation(); });
    add(box, h('div', { cls: 'op-meta' }, o.op.summary ? h('span', null, h('b', { text: o.op.summary })) : null,
      h('span', { cls: 'mono', text: id })));
    if (o.op.state === 'tested') {
      add(box, h('div', { cls: 'op-stats', 'aria-label': 'Requests and replies' },
        h('div', { cls: 'stat' }, h('span', { cls: 'k', text: 'Requests' }), h('b', { text: n(o.op.requests) }), h('span', { cls: 'p', text: 'sent' })),
        present(o.byClass).map(function (c) {
          return h('div', { cls: 'stat' }, h('span', { cls: 'k' }, h('i', { cls: swatch(c) }), classWord(c)),
            h('b', { text: n(o.byClass[c]) }), h('span', { cls: 'p', text: pct(o.byClass[c], o.op.requests) + ' of the replies' }));
        })));
    }
    if (o.op.state === 'couldNotBeTested') add(box, h('div', { cls: 'how', text: 'Not tested: ' + o.op.reason }));
    if (o.op.state === 'notReached') add(box, h('div', { cls: 'how', text: 'Not tested: no request went to it. The run ended first, or no request could be built for it from what the document says.' }));
    if (o.op.state === 'leftAloneByThePlan') add(box, h('div', { cls: 'how', text: 'Left alone by the plan, on purpose: no request went to it.' }));
    if (o.light === 'clean') add(box, h('div', { cls: 'how', text: unjudgedOf[id]
      ? 'Nothing was found on this operation, but ' + plural(unjudgedOf[id], 'reply', 'replies') + ' could not be judged by every check that applies: see what could not be tested or read.'
      : 'Nothing was found on this operation: none of its replies broke a rule.' }));
    if (!o.faults.length) return box;

    add(box, h('div', { cls: 'ktabs', role: 'group', 'aria-label': 'Kinds of fault on this operation' },
      o.faults.map(function (f) {
        var on = f.code === chosen, err = f.severity === 'error';
        return h('button', { type: 'button', cls: 'ktab ' + (err ? 'err' : 'warn') + (on ? ' on' : ''),
          'aria-pressed': on ? 'true' : 'false',
          onclick: function () {
            state.kind[id] = f.code;
            drawRows();
            var tab = detailOf(o).querySelector('.ktab.on');
            if (tab) tab.focus();
          } },
          err ? ICON.error(16) : ICON.warning(16), h('span', { text: f.title }), h('span', { cls: 'n', text: n(f.count) }));
      })));

    var found = firstFinding[id + '\u0000' + chosen];
    if (!found) {
      add(box, h('div', { cls: 'how', text: n(fault.count) + ' like it on this operation, all of them counted and none written out whole: report.json writes out up to '
        + n(R.limits.writeUpsPerOperationAndKind) + ' of each kind on each operation, and ' + n(R.limits.writeUpsInTotal) + ' in all.' }));
      return box;
    }
    add(box, finding(found, fault, o));
    return box;
  }

  // --- one fault, written out ---------------------------------------------------------------------

  function jsonLine(line) {
    var out = [], re = /("(?:[^"\\]|\\.)*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b|([{}\[\],])/g, last = 0, m;
    while ((m = re.exec(line))) {
      if (m.index > last) out.push([line.slice(last, m.index), 't-x']);
      if (m[1]) { out.push([m[1], m[2] ? 't-k' : 't-s']); if (m[2]) out.push([m[2], 't-p']); }
      else if (m[3]) out.push([m[3], 't-n']);
      else if (m[4]) out.push([m[4], 't-w']);
      else out.push([m[5], 't-p']);
      last = re.lastIndex;
    }
    if (last < line.length) out.push([line.slice(last), 't-x']);
    return out.length ? out : [[' ', 't-x']];
  }
  /**
   * JSON laid out two spaces to a level, every character of it as it was sent: a number is never read
   * as one, so one too long for JavaScript to hold is shown as it went.
   */
  function indented(text) {
    var out = '', depth = 0, inString = false, escaped = false;
    function pad() { return '\n' + new Array(depth + 1).join('  '); }
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (inString) {
        out += c;
        if (escaped) escaped = false;
        else if (c === '\\') escaped = true;
        else if (c === '"') inString = false;
      } else if (c === '"') {
        out += c;
        inString = true;
      } else if (c === '{' || c === '[') {
        var j = i + 1;
        while (j < text.length && /\s/.test(text.charAt(j))) j++;
        if (text.charAt(j) === (c === '{' ? '}' : ']')) {
          out += c + text.charAt(j);
          i = j;
        } else {
          depth++;
          out += c + pad();
        }
      } else if (c === '}' || c === ']') {
        depth--;
        out += pad() + c;
      } else if (c === ',') {
        out += c + pad();
      } else if (c === ':') {
        out += ': ';
      } else if (!/\s/.test(c)) {
        out += c;
      }
    }
    return out;
  }
  function bodyLines(body) {
    if (!body) return [];
    var lines;
    if (body.text === undefined) {
      lines = [[['(' + (body.mediaType || 'a body') + ', not text, in report.json in Base64)', 't-d']]];
    } else {
      var text = body.text, json = /json/i.test(body.mediaType || '');
      if (json) { try { JSON.parse(text); text = indented(text); } catch (e) { json = false; } }
      lines = text.split('\n').map(function (l) { return json ? jsonLine(l) : [[l || ' ', 't-x']]; });
    }
    if (body.wireLength) lines.push([['(cut short: the whole body was ' + n(body.wireLength) + ' bytes)', 't-d']]);
    return lines;
  }
  function message(start, headers, body) {
    var lines = [start];
    (headers || []).forEach(function (hd) { lines.push([[hd.name, 't-hn'], [': ', 't-p'], [hd.value, 't-hv']]); });
    var b = bodyLines(body);
    if (b.length) { lines.push([[' ', 't-x']]); lines = lines.concat(b); }
    return lines;
  }
  function exchange(found) {
    var i = found.interaction, target = i.request.url;
    try { var u = new URL(i.request.url); target = u.pathname + u.search; } catch (e) { /* keep it whole */ }
    var out = i.outcome, hasStatus = out.status !== undefined && out.status !== null;
    var request = message([[i.request.method, 't-m'], [' ' + target, 't-u']], i.request.headers, i.request.body);
    var first = (out.protocol ? [[out.protocol.toUpperCase() + ' ', 't-d']] : [])
      .concat(hasStatus ? [[out.status + (out.statusText ? ' ' + out.statusText : ''), 't-s' + String(out.status).charAt(0)]] : []);
    var reply = out.kind === 'failed'
      ? [[['No reply: ' + (out.reason || 'nothing came back'), 't-s5']]]
      : message(first.length ? first : [['(no status line)', 't-d']], out.headers, out.body);
    if (out.kind === 'malformed') reply.push([['(' + (out.reason || 'not a whole reply') + ')', 't-d']]);
    return { request: request, reply: reply };
  }
  function plainText(lines) {
    return lines.map(function (line) { return line.map(function (part) { return part[0]; }).join('').replace(/\s+$/, ''); }).join('\n');
  }
  function fence(text, language) {
    var longest = 2;
    (text.match(/`+/g) || []).forEach(function (run) { longest = Math.max(longest, run.length); });
    var ticks = new Array(longest + 2).join('`');
    return ticks + language + '\n' + text + '\n' + ticks;
  }
  function issue(found, o, http) {
    return '### ' + found.category.title + ' (F' + found.category.code + ') on ' + (o.op.method ? o.op.method + ' ' + o.op.path : o.op.operation) + '\n\n'
      + capital(found.summary) + '.\n'
      + (found.details.length ? '\n' + found.details.map(function (d) { return '- ' + d; }).join('\n') + '\n' : '')
      + '\n**Request**\n\n' + fence(plainText(http.request), 'http')
      + '\n\n**Reply**\n\n' + fence(plainText(http.reply), 'http')
      + '\n\n**Reproduce**\n\n' + fence(found.curl, 'bash') + '\n';
  }
  function pane(title, note, lines) {
    return h('div', { cls: 'pane' }, h('div', { cls: 'pane-h' }, h('span', { text: title }), h('span', { text: note })),
      h('div', { cls: 'code' }, lines.map(function (line) {
        return h('div', { cls: 'ln' }, line.map(function (part) { return h('span', { cls: part[1], text: part[0] }); }));
      })));
  }
  function finding(found, fault, o) {
    var tc = found.interaction.testCase, how = [];
    if (tc.intent === 'pushing') how.push('Built on purpose from a value an API should turn away.');
    if (tc.mutation) how.push('One thing changed in a request the API had accepted: ' + tc.mutation.description + '.');
    if (tc.sequence) how.push('A step of a series about a thing the run created: ' + tc.sequence.description + '.');
    var http = exchange(found);
    var elapsed = Math.round(seconds(found.interaction.elapsed) * 10000) / 10;
    return h('div', { cls: 'finding' },
      h('div', { cls: 'fsum', text: capital(found.summary) }),
      found.details.length ? h('ul', { cls: 'fdetails' }, found.details.map(function (d) { return h('li', { text: d }); })) : null,
      how.length ? h('div', { cls: 'how', text: how.join(' ') }) : null,
      (tc.parameters || []).length ? h('div', { cls: 'chips' }, tc.parameters.map(function (p) {
        var value = JSON.stringify(p.value);
        var origin = p.origin ? (p.origin.source || p.origin.kind) : '';
        return h('span', { cls: 'chip', title: p.name + ' = ' + value },
          p.name + ' ', h('span', { cls: 'o', text: 'in ' + String(p.in).toLowerCase() }),
          ' = ' + (value.length > 48 ? value.slice(0, 46) + '…' : value) + ' ', origin ? h('span', { cls: 'o', text: '· ' + origin }) : null);
      })) : null,
      h('div', { cls: 'acts' },
        copyButton('Copy curl', ICON.copy, found.curl, true),
        copyButton('Copy as issue', ICON.issue, function () { return issue(found, o, http); }, false),
        h('span', { cls: 'seen', text: n(fault.count) + ' like it on this operation · ' + n(fault.writtenInFull) + ' written out whole in report.json' })),
      h('div', { cls: 'http' },
        pane('Request', found.interaction.request.method + (found.interaction.request.body ? ' · ' + found.interaction.request.body.mediaType : ''), http.request),
        pane('Reply', found.interaction.outcome.kind === 'failed' ? 'no reply after ' + elapsed + ' ms'
          : (found.interaction.outcome.status ? found.interaction.outcome.status + ' · ' : '') + 'answered in ' + elapsed + ' ms', http.reply)));
  }

  // --- the kinds found --------------------------------------------------------------------------

  function kindsSection() {
    var openKinds = table(), discloses = table();
    var panel = h('div', { cls: 'panel' });
    function draw() {
      panel.textContent = '';
      if (!kindsInOrder.length) {
        add(panel, h('div', { cls: 'empty', text: 'Nothing was found.' }));
        return;
      }
      kindsInOrder.forEach(function (k) {
        var err = k.severity === 'error', own = k.code >= 900 && k.code <= 999;
        var affected = operations.map(function (o) { return { o: o, f: o.faults.find(function (f) { return f.code === k.code; }) }; })
          .filter(function (a) { return a.f; })
          .sort(function (a, b) { return b.f.count - a.f.count; });
        var carried = (R.faultsByStatus || []).filter(function (s) { return s.code === k.code; })
          .sort(function (a, b) { return b.count - a.count; })
          .map(function (s) { return classWord(s.statusClass) + ' ' + n(s.count); }).join(' · ');
        var open = !!openKinds[k.code];
        var tip = own
          ? 'F' + k.code + ' is RESTest’s own code, for “' + k.descriptiveName + '”.\n' + catalogue + ' has no number for this kind, so RESTest numbers it from 900 to 999.'
          : 'F' + k.code + ' in ' + catalogue + ': “' + k.descriptiveName + '”.\nThe shared catalogue that lets testing tools compare the faults they find.';
        add(panel, h('div', { cls: 'kind' },
          h('span', { cls: 'light' }, err ? ICON.error(20) : ICON.warning(20)),
          h('div', { cls: 'kind-t' }, h('span', { cls: 'ttl', text: k.title }),
            h('span', { cls: 'wfc', tabindex: 0, 'data-tip': tip, 'aria-label': tip, text: '(F' + k.code + ')' }),
            h('span', { cls: 'sev ' + (err ? 'err' : 'warn'), text: err ? 'error' : 'warning' })),
          h('div', { cls: 'kind-c' }, n(k.count), h('small', { text: 'on ' + plural(affected.length, 'operation', 'operations') })),
          k.advice ? h('div', { cls: 'kind-a', text: capital(k.advice) + '.' }) : null,
          carried ? h('div', { cls: 'kind-b', text: 'came back as ' + carried }) : null,
          h('div', { cls: 'kind-x' },
            discloses[k.code] = disclose(open, plural(affected.length, 'operation', 'operations'), function () {
              openKinds[k.code] = !open;
              draw();
              discloses[k.code].focus();
            }),
            open ? h('div', { cls: 'kind-ops' }, affected.map(function (a) {
              return h('button', { type: 'button', cls: 'opchip', onclick: function () { jump(a.o.op.operation, k.code); } },
                h('span', { cls: 'meth m-' + (a.o.op.method || ''), text: a.o.op.method || '' }), where(a.o),
                h('span', { cls: 'n', text: n(a.f.count) }));
            })) : null)));
      });
    }
    draw();
    return h('section', { id: 'kinds', 'aria-label': 'What was found' },
      h('div', { cls: 'sec-h' }, h('h2', { text: 'What was found' }),
        h('span', { cls: 'aside', text: plural(R.totals.faults, 'fault', 'faults') + ' of ' + plural(kindsInOrder.length, 'kind', 'kinds') })),
      panel);
  }
  function jump(id, code) {
    state.open[id] = true;
    state.kind[id] = code;
    state.filter = 'all';
    state.query = '';
    var search = document.querySelector('.search input');
    if (search) search.value = '';
    markFilters();
    drawRows();
    var target = document.getElementById('op-' + id);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // --- what could not be seen, and how the run was started ------------------------------------------

  function disclose(open, label, toggle) {
    return h('button', { type: 'button', cls: 'disclose' + (open ? ' open' : ''), 'aria-expanded': open ? 'true' : 'false',
      onclick: toggle }, ICON.chevron(14), (open ? 'Hide' : 'Show') + ' the ' + label);
  }
  function listRow(icon, title, value, valueCls, note, items) {
    var row = h('div', { cls: 'lrow' });
    var open = items.length > 0 && items.length <= 3;
    function draw() {
      row.textContent = '';
      add(row, h('div', { cls: 'lrow-h' }, icon, h('span', { cls: 'lt', text: title }),
        h('span', { cls: 'lv ' + (valueCls || ''), text: value }), h('span', { cls: 'ld', text: note }),
        items.length ? disclose(open, n(items.length), function () {
          open = !open;
          draw();
          row.querySelector('.disclose').focus();
        }) : null));
      if (open && items.length) add(row, h('ul', { cls: 'llist' }, items.map(function (item) { return h('li', { text: item }); })));
    }

    return row;
  }
  function gapsSection() {
    var g = gaps();
    function gapRow(counted, title, note, items) {
      return listRow(h('span', { cls: 'light' }, counted ? ICON.warning(20) : ICON.clean(20)), title, n(counted),
        counted ? 'warn' : 'zero', note, items);
    }
    var total = g.total;
    return h('section', { id: 'gaps', 'aria-label': 'What could not be tested or read' },
      h('div', { cls: 'sec-h' }, h('h2', { text: 'What could not be tested or read' }),
        h('span', { cls: 'aside', text: total ? plural(total, 'thing', 'things') + ' the run could not see' : 'nothing the run could not see' })),
      h('div', { cls: 'panel' },
        gapRow(g.notTested.length, 'Operations not tested',
          g.notTested.length ? 'Each with the reason no request went to it; they are in the operations above too.' : 'Every operation in the document was tested' + (count.leftAlone ? ', but those the plan left alone.' : '.'),
          g.notTested.map(function (o) { return o.op.operation + ' — ' + (o.op.reason || 'no request went to it: the run ended first, or none could be built for it'); })),
        gapRow(g.notChecked.length, 'Checks that could not judge some replies',
          g.notChecked.length ? 'Each with how many replies it could not judge, and why; a reply a check could not judge says nothing about it.' : 'Every reply could be judged by every check that applied to it.',
          g.notChecked.map(function (line) { return line.what + ' of ' + plural(line.replies, 'reply', 'replies') + ': ' + line.why; })),
        gapRow(g.issues.length, 'Parts of the document not read',
          g.issues.length ? 'What could not be used as the document writes it. An operation that could not be read at all is with the operations not tested.' : 'The whole document could be read.',
          g.issues.map(function (i) { return i.location + ': ' + i.message + (ISSUE_COST[i.effect] || ''); })),
        gapRow(g.keys.length, 'Keys nobody handed over',
          g.keys.length ? 'Operations that ask for them are expected to be refused; --auth gives them.' : 'Every key the document asks for was given, or none is asked for.',
          g.keys.map(function (k) { return k.scheme + ', in the ' + (k.in === 'formField' ? 'form field' : k.in) + ' ' + k.name + ': asked for by ' + plural(k.operations, 'operation', 'operations'); }))));
  }
  /** The number the command ended with, for each verdict report.json can write, and what it means. */
  var EXIT_CODES = {
    noErrorsFound: ['0', 'ok', 'no error was found in the API; warnings do not fail a run unless checks.failOnWarnings says so'],
    errorsFound: ['1', 'err', 'errors were found in the API'],
    failedOnWarnings: ['1', 'err', 'only warnings were found, and checks.failOnWarnings makes them fail the run'],
    nothingTested: ['3', 'warn', 'nothing was tested: not one request went out'],
    nothingAnswered: ['3', 'warn', 'nothing was tested: the API answered none of the requests'],
    stopped: ['130 or 143', 'warn', 'the run was stopped from outside: 130 for Ctrl-C, 143 for kill or docker stop']
  };
  function runSection() {
    var exit = EXIT_CODES[R.verdict] || [R.verdict, '', ''];
    var changed = (R.settings || []).filter(function (s) { return s.source !== 'default'; });
    var plan = R.run.plan, file = R.run.settingsFile;
    return h('section', { id: 'run', 'aria-label': 'How it was run' },
      h('div', { cls: 'sec-h' }, h('h2', { text: 'How it was run' })),
      h('div', { cls: 'panel' },
        listRow(h('span', { cls: 'ico' }, ICON.exit()), 'Exit code', exit[0], exit[1], capital(exit[2]) + (exit[2] ? '.' : ''), []),
        listRow(h('span', { cls: 'ico' }, ICON.plan()), 'Plan', plan || 'Default', '',
          plan ? 'handed over with --campaign' : 'the plan RESTest carries: no --campaign was given', []),
        listRow(h('span', { cls: 'ico' }, ICON.settings()), 'Settings', changed.length ? n(changed.length) + ' of ' + n(R.settings.length) + ' changed' : 'Defaults', '',
          (file ? 'read from ' + file + ' (--settings)' : 'no --settings file was given') + (changed.length ? '' : ', and none was changed with --set or the environment'),
          changed.map(function (s) { return s.key + ' = ' + s.value + '   (' + s.source + ')'; })),
        listRow(h('span', { cls: 'ico' }, ICON.clock()), 'Time given', duration(seconds(R.timeline.budget)), '',
          duration(seconds(R.totals.elapsed)) + ' spent, reading the document included', []),
        listRow(h('span', { cls: 'ico' }, ICON.store()), 'Every request and reply', R.run.stored ? 'Kept in run.sqlite' : 'Not kept', R.run.stored ? '' : 'zero',
          R.run.stored ? 'beside this file; any SQLite client opens it' : 'pass --store to keep every request and reply in run.sqlite', [])));
  }

  function draw() {
    var app = document.getElementById('app');
    add(app, [header(), menu(),
      h('main', { cls: 'wrap' }, summary(), timeline(), operationsSection(), kindsSection(), gapsSection(), runSection(),
        h('footer', null, h('span', { text: 'Written by RESTest ' + R.tool.version + ' on ' + when(R.createdAt) })))]);
    markTheme();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', markTheme);
  }

  try {
    read();
    draw();
  } catch (failure) {
    var app = document.getElementById('app');
    app.textContent = '';
    add(app, h('p', { cls: 'broken', text: 'This page could not draw the report (' + failure.message
      + '). The same run, in full, is in report.json, beside this file.' }));
  }
}());
