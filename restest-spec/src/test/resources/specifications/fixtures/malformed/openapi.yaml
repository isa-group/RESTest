openapi: 3.0.3
info:
  title: Fixture - one malformed operation
  version: "1.0"
  description: >
    Hand-written for this corpus, not carried over from any real API. Two operations: one valid,
    one whose request body references a schema that was never defined. A parser that resolves
    references eagerly fails on the dangling $ref before it ever reaches the valid operation; one
    that resolves lazily and reports per-operation should skip only the second and still return the
    first.
paths:
  /widgets:
    get:
      operationId: listWidgets
      responses:
        "200":
          description: A list of widgets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
  /widgets/{widgetId}/gadget:
    post:
      operationId: attachGadget
      parameters:
        - name: widgetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Gadget"
      responses:
        "204":
          description: Attached.
components:
  schemas:
    Widget:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
