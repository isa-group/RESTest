  version: "1.0"
  description: >
    Hand-written for this corpus, not carried over from any real API. Otherwise a perfectly ordinary
    document; only the declared version is out of scope (ADR-0007, reversed at M1.2). Exercises the
    "unsupported version skipped and reported, run not fatal" path, distinct from a malformed
    document within a supported version (see the sibling fixtures/malformed/ directory).
