name: Nightly benchmark

# Five containerised APIs, a ten-minute budget, three repetitions. The point is that a regression
# in operations covered or in faults found is visible the next morning, not at the end of a
# milestone. This does NOT use the evaluation platform — see ADR-0011. Milestone campaigns are run
# by hand with ./evaluation/run-evaluation.sh.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC, i.e. 03:00 or 04:00 in Seville
  workflow_dispatch:       # also runnable on demand from the Actions tab

permissions:
  contents: read

jobs:
  benchmark:
    name: Nightly benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: ./mvnw -B -q install -DskipTests

      - name: Run the benchmark
        run: ./mvnw -B verify -Pnightly -Dbenchmark.budget=10m -Dbenchmark.repetitions=3

      - name: Publish the scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-scoreboard-${{ github.run_number }}
          path: target/benchmark/
          retention-days: 90

      - name: Summarise in the run page
        if: always()
        run: cat target/benchmark/scoreboard.md >> "$GITHUB_STEP_SUMMARY" || true
