# Dependency updates arrive as reviewable pull requests rather than as drift.
#
# Switched off for now by the maintainer (3 October 2026): an open-pull-requests-limit of 0 is how
# GitHub stops version updates while keeping the configuration. To switch them back on, give each
# entry its limit again - 5 for Maven, GitHub's default of 5 for the actions.
#
# Grouped on purpose: nine modules share one version property per dependency, so an ungrouped
# update would open several pull requests that all have to land together anyway.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
    groups:
      test-libraries:
        patterns:
          - org.junit*
          - org.assertj*
          - com.tngtech.archunit*
          - org.testcontainers*
          - org.wiremock*
      build-plugins:
        patterns:
          - org.apache.maven.plugins*
          - org.jacoco*
          - org.pitest*
      # Pairs whose versions must move together, or the build mixes two releases of one library.
      jackson:
        patterns:
          - com.fasterxml.jackson*
      swagger:
        patterns:
          - io.swagger*

  # Keeps the commit-SHA pins in .github/workflows current. Dependabot rewrites both the SHA and
  # the trailing version comment, which is why that comment is required rather than decorative.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
